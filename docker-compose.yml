version: "3.8"

services:
    mysql:
        image: mysql:8.3.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: network
        ports:
            - "3309:3306"
        networks:
            - social

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        networks:
            - social

    zookeeper:
        image: "bitnami/zookeeper:3.8.4-debian-12-r8"
        ports:
            - "2181:2181"
        networks:
            - social
        environment:
            - ALLOW_ANONYMOUS_LOGIN=yes

    kafka:
        image: "bitnami/kafka:3.7.1-debian-12-r0"
        ports:
            - "29092:29092"
        networks:
            - social
        environment:
            - KAFKA_BROKER_ID=2
            - KAFKA_CFG_LISTENERS=PLAINTEXT://:29092
            - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:29092
            - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
            - ALLOW_PLAINTEXT_LISTENER=yes
        depends_on:
            - zookeeper

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
        container_name: elasticsearch
        environment:
            - discovery.type=single-node
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
            - xpack.security.enabled=true
            - ELASTIC_USERNAME=elastic
            - ELASTIC_PASSWORD=admin
        ports:
            - 9200:9200 # for REST API access
        networks:
            - social
        # - 9300:9300 # for inter-node communication
        volumes:
            - esdata:/usr/share/elasticsearch/data
    
    # grafana
    grafana:
        image: grafana/grafana
        ports:
            - "3100:3000"
        container_name: grafana
        restart: unless-stopped
        networks:
            - social
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
        depends_on:
            - prometheus
        volumes:
            - grafana-data:/var/lib/grafana
            - ./grafana.ini:/etc/grafana/grafana.ini

    # Install prometheus and node-exporter
    prometheus:
        image: prom/prometheus
        container_name: prometheus
        ports:
            - "9090:9090"
        networks:
            - social
        volumes:
            - prometheus:/prometheus
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        
    # A Prometheus exporter that collects hardware and OS-level metrics from Linux and other Unix-like systems. Node Exporter enables monitoring of host-level resources and performance metrics.
    # exporter:
    #     image: prom/node-exporter:latest
    #     container_name: exporter
    #     ports:
    #         - "9100:9100"
    #     networks:
    #         - social
    #     volumes:
    #         - /proc:/host/proc:ro
    #         - /sys:/host/sys:ro
    #         - /:/rootfs:ro
    #     command:
    #         - "--path.procfs=/host/proc"
    #         - "--path.sysfs=/host/sys"
    #         - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

    langfuse-postgres:
        image: postgres:16-alpine
        container_name: langfuse-postgres
        environment:
            - POSTGRES_DB=langfuse
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        ports:
            - "5432:5432"
        networks:
            - social
        volumes:
            - langfuse-postgres-data:/var/lib/postgresql/data

    langfuse-clickhouse:
        image: clickhouse/clickhouse-server:24.8
        container_name: langfuse-clickhouse
        environment:
            - CLICKHOUSE_DB=default
            - CLICKHOUSE_USER=default
            - CLICKHOUSE_PASSWORD=clickhouse
        ports:
            - "8123:8123"
            - "9000:9000"
        networks:
            - social
        volumes:
            - langfuse-clickhouse-data:/var/lib/clickhouse

    langfuse-minio:
        image: minio/minio:RELEASE.2024-10-02T17-50-41Z
        container_name: langfuse-minio
        command: server /data --console-address ":9001"
        environment:
            - MINIO_ROOT_USER=minio
            - MINIO_ROOT_PASSWORD=minio123
        ports:
            - "9001:9001"
            - "9002:9000"
        networks:
            - social
        volumes:
            - langfuse-minio-data:/data

    langfuse-worker:
        image: langfuse/langfuse-worker:latest
        container_name: langfuse-worker
        depends_on:
            - langfuse-postgres
            - langfuse-clickhouse
            - langfuse-minio
        networks:
            - social
        environment:
            - DATABASE_URL=postgresql://postgres:postgres@langfuse-postgres:5432/langfuse
            - CLICKHOUSE_CLUSTER_ENABLED=false
            - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
            - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
            - CLICKHOUSE_USER=default
            - CLICKHOUSE_PASSWORD=clickhouse
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - SALT=change-me
            - NEXTAUTH_SECRET=Optqq_opuZ7Zc4tR9NZwEB8rb9IOqbAyO99hNiiF9jA
            - AUTH_SECRET=nIsoyWSgX00UrmDrTcNexFW0qj4pBu2Go5uPDNedc1k
            - ENCRYPTION_KEY=5d40991a51f84e0e0c48fc388dabd81f8aa6b5c3597bb03b887b0f1a77e00ca9
            - LANGFUSE_INIT_ORG_ID=org_123
            - LANGFUSE_INIT_ORG_NAME=Default Org
            - LANGFUSE_INIT_PROJECT_ID=proj_123
            - LANGFUSE_INIT_PROJECT_NAME=Default Project
            - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=pk-lf-change-me
            - LANGFUSE_INIT_PROJECT_SECRET_KEY=sk-lf-change-me
            - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
            - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
            - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minio
            - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=minio123
            - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
            - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true

    langfuse-web:
        image: langfuse/langfuse:latest
        container_name: langfuse-web
        ports:
            - "3000:3000"
        depends_on:
            - langfuse-postgres
            - langfuse-clickhouse
            - langfuse-minio
            - langfuse-worker
        networks:
            - social
        environment:
            - DATABASE_URL=postgresql://postgres:postgres@langfuse-postgres:5432/langfuse
            - CLICKHOUSE_CLUSTER_ENABLED=false
            - CLICKHOUSE_URL=http://langfuse-clickhouse:8123
            - CLICKHOUSE_MIGRATION_URL=clickhouse://langfuse-clickhouse:9000
            - CLICKHOUSE_USER=default
            - CLICKHOUSE_PASSWORD=clickhouse
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - NEXTAUTH_URL=http://localhost:3000
            - NEXTAUTH_SECRET=Optqq_opuZ7Zc4tR9NZwEB8rb9IOqbAyO99hNiiF9jA
            - AUTH_SECRET=nIsoyWSgX00UrmDrTcNexFW0qj4pBu2Go5uPDNedc1k
            - SALT=change-me
            - ENCRYPTION_KEY=5d40991a51f84e0e0c48fc388dabd81f8aa6b5c3597bb03b887b0f1a77e00ca9
            - MINIO_ROOT_USER=minio
            - MINIO_ROOT_PASSWORD=minio123
            - MINIO_ENDPOINT=langfuse-minio:9000
            - MINIO_SSL=false
            - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
            - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
            - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=minio
            - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=minio123
            - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
            - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
            - LANGFUSE_INIT_ORG_ID=org_123
            - LANGFUSE_INIT_ORG_NAME=Default Org
            - LANGFUSE_INIT_PROJECT_ID=proj_123
            - LANGFUSE_INIT_PROJECT_NAME=Default Project
            - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=pk-lf-change-me
            - LANGFUSE_INIT_PROJECT_SECRET_KEY=sk-lf-change-me


volumes:
    esdata:
        driver: local
    grafana-data: # Added volume for Grafana
        driver: local
    prometheus:
        driver: local
    langfuse-postgres-data:
        driver: local
    langfuse-clickhouse-data:
        driver: local
    langfuse-minio-data:
        driver: local

networks:
    social:
        driver: bridge